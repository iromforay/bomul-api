<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노트 관리</title>
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-sunken: #f5f6f8;
    --border: #e6e8ec;
    --text: #16181d;
    --text-muted: #6b7280;
    --text-faint: #9aa1ac;
    --accent: #006eff;
    --accent-soft: #e4efff;
    --tab-inactive: #8b93a3;
    --btn-action-bg: #e7e9ed;
    --btn-action-fg: #4b5563;
    --st-consulting: #006eff;
    --st-proposed: #e08a1c;
    --st-contracted: #1bab5e;
    --st-lost: #8b93a3;
    --shadow: 0 1px 2px rgba(20, 23, 31, 0.05);
    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg: #14161c;
    --surface: #1b1e26;
    --surface-sunken: #21242e;
    --border: #2c303b;
    --text: #eceef2;
    --text-muted: #9aa1ac;
    --text-faint: #6b7280;
    --accent: #3d8bff;
    --accent-soft: #182643;
    --tab-inactive: #3a4150;
    --btn-action-bg: #2c303b;
    --btn-action-fg: #c4c9d2;
    --shadow: 0 1px 2px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c; --surface: #1b1e26; --surface-sunken: #21242e; --border: #2c303b;
      --text: #eceef2; --text-muted: #9aa1ac; --text-faint: #6b7280;
      --accent: #3d8bff; --accent-soft: #182643; --tab-inactive: #3a4150;
      --btn-action-bg: #2c303b; --btn-action-fg: #c4c9d2;
      --shadow: 0 1px 2px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 70px; }

  h1.page-title { font-size: 22px; font-weight: 800; margin: 0 0 18px; letter-spacing: -0.01em; }

  /* ---- 상단 상태 탭 ---- */
  .status-tabs {
    display: grid;
    grid-template-columns: 1fr repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .status-tab {
    border-radius: 10px 10px 0 0;
    padding: 16px 18px;
    cursor: pointer;
    background: var(--tab-inactive);
    color: #ffffff;
  }
  .status-tab.active { background: var(--surface); color: var(--text); }
  .status-tab-label { font-size: 14.5px; font-weight: 700; display: block; margin-bottom: 6px; }
  .status-tab-caption { font-size: 11px; opacity: 0.85; display: block; }
  .status-tab-count { font-size: 22px; font-weight: 800; display: block; margin-top: 2px; }
  .status-tab:not(.active) .status-tab-count { font-size: 12px; font-weight: 600; opacity: 0.85; }

  /* ---- 본문 패널 ---- */
  .panel {
    background: var(--surface);
    border-radius: 0 10px 10px 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }

  select, .text-input {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 12px;
  }
  select { min-width: 108px; }
  .text-input { min-width: 140px; }
  select:focus, .text-input:focus { outline: none; border-color: var(--accent); }
  .text-input::placeholder { color: var(--text-faint); }

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    border-radius: 7px;
    padding: 9px 16px;
    cursor: pointer;
    border: none;
    white-space: nowrap;
  }
  .btn-muted { background: var(--btn-action-bg); color: var(--btn-action-fg); }
  .btn-primary { background: var(--accent); color: #fff; margin-left: auto; padding: 10px 20px; font-size: 13.5px; }
  .btn-primary:hover { filter: brightness(1.06); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: center;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 12.5px;
    padding: 13px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    text-align: center;
    padding: 14px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:hover { background: var(--surface-sunken); }
  tbody tr:last-child td { border-bottom: none; }

  td.col-visitor { text-align: left; font-weight: 700; }
  td.col-visitor .phone { display: block; font-weight: 400; color: var(--text-faint); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  td.col-area { text-align: left; color: var(--text-muted); }
  td.col-date { color: var(--text-faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  .tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    border-radius: 5px;
    padding: 3px 8px;
    color: #fff;
    white-space: nowrap;
  }
  .tag-tenant { background: #4b5563; }
  .tag-landlord { background: #6b5bd6; }

  .pill {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    border-radius: 5px;
    padding: 4px 10px;
    color: #fff;
  }
  .pill-consulting  { background: var(--st-consulting); }
  .pill-proposed    { background: var(--st-proposed); }
  .pill-contracted  { background: var(--st-contracted); }
  .pill-lost         { background: var(--st-lost); }

  .memo-count {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-muted);
    background: none;
    border: none;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .memo-count:hover { background: var(--surface-sunken); color: var(--accent); }
  .memo-count svg { width: 13px; height: 13px; opacity: 0.7; }

  .row-actions { display: flex; gap: 6px; justify-content: center; }
  .row-actions .btn { padding: 7px 12px; font-size: 12.5px; }

  .pagination { display: flex; justify-content: center; gap: 6px; padding: 20px; }
  .page-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .page-btn.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  /* 노트 등록/수정은 note_register.html, 상세페이지 전체 정보는 note_detail.html 참고.
     이 팝업은 리스트에서 메모만 빠르게 보고/남기기 위한 용도. */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15, 17, 22, 0.42);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }

  .memo-modal {
    width: min(480px, 100%);
    max-height: min(600px, 100%);
    background: var(--surface);
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    animation: popin 0.15s ease;
  }
  @keyframes popin { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .memo-modal-head {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .memo-modal-head h2 { font-size: 16px; font-weight: 800; margin: 0 0 3px; }
  .memo-modal-head .phone { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .memo-modal-head .head-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .memo-modal-head .detail-link { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 700; white-space: nowrap; }
  .memo-modal-close {
    border: none; background: var(--surface-sunken); color: var(--text-muted);
    width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 14px; flex: 0 0 auto;
  }

  .memo-modal-body { padding: 16px 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 80px; }
  .memo-modal .memo-item { display: flex; gap: 10px; }
  .memo-modal .memo-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; flex: 0 0 auto;
  }
  .memo-modal .memo-bubble { background: var(--surface-sunken); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.55; }
  .memo-modal .memo-byline { display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px; }
  .memo-modal .memo-writer { font-size: 12.5px; font-weight: 700; }
  .memo-modal .memo-time { font-size: 10.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .memo-modal .memo-empty { font-size: 13px; color: var(--text-faint); margin: 0; }

  .memo-modal-form { display: flex; gap: 8px; border-top: 1px solid var(--border); padding: 14px 20px; }
  .memo-modal-form textarea {
    flex: 1; font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--surface-sunken); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; resize: none; min-height: 40px; max-height: 100px; line-height: 1.5;
  }
  .memo-modal-form textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .memo-modal-form button { flex: 0 0 auto; align-self: flex-end; }
</style>
</head>
<body>

<div class="page">
  <h1 class="page-title">노트 관리</h1>

  <div class="status-tabs">
    <div class="status-tab active" data-status="all">
      <span class="status-tab-label">전체</span>
      <span class="status-tab-caption">글 총갯수</span>
      <span class="status-tab-count">12</span>
    </div>
    <div class="status-tab" data-status="consulting">
      <span class="status-tab-label">상담중</span>
      <span class="status-tab-caption">글 총갯수</span>
      <span class="status-tab-count">5</span>
    </div>
    <div class="status-tab" data-status="proposed">
      <span class="status-tab-label">매물제안</span>
      <span class="status-tab-caption">글 총갯수</span>
      <span class="status-tab-count">3</span>
    </div>
    <div class="status-tab" data-status="contracted">
      <span class="status-tab-label">계약완료</span>
      <span class="status-tab-caption">글 총갯수</span>
      <span class="status-tab-count">2</span>
    </div>
    <div class="status-tab" data-status="lost">
      <span class="status-tab-label">이탈</span>
      <span class="status-tab-caption">글 총갯수</span>
      <span class="status-tab-count">2</span>
    </div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <select id="fVisitType">
        <option value="">방문형태</option>
        <option value="tenant">세입자</option>
        <option value="landlord">임대인</option>
      </select>
      <select id="fTxnType">
        <option value="">거래방식</option>
        <option value="sale">매매</option>
        <option value="jeonse">전세</option>
        <option value="monthly">월세</option>
      </select>
      <input class="text-input" type="text" placeholder="방문자명">
      <input class="text-input" type="text" placeholder="연락처">
      <button class="btn btn-muted" type="button">검색</button>
      <button class="btn btn-muted" type="button">초기화</button>
      <a class="btn btn-primary" href="note_register.html">노트 등록</a>
    </div>

    <table>
      <thead>
        <tr>
          <th>글번호</th>
          <th>방문형태</th>
          <th>방문자</th>
          <th>거래방식</th>
          <th>관심매물</th>
          <th>희망지역</th>
          <th>상태</th>
          <th>메모</th>
          <th>방문예정일</th>
          <th>등록일</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="noteTbody"></tbody>
    </table>

    <div class="pagination">
      <button class="page-btn active" type="button">1</button>
      <button class="page-btn" type="button">2</button>
    </div>
  </div>
</div>

<!-- 리스트에서 메모만 빠르게 보고/등록하는 레이어 팝업 (전체 정보는 note_detail.html) -->
<div class="modal-overlay" id="memoModalOverlay">
  <div class="memo-modal" id="memoModal"></div>
</div>

<script>
  var STATUS_LABEL = { consulting: '상담중', proposed: '매물제안', contracted: '계약완료', lost: '이탈' };
  var STATUS_PILL  = { consulting: 'pill-consulting', proposed: 'pill-proposed', contracted: 'pill-contracted', lost: 'pill-lost' };
  var VISIT_LABEL = { tenant: '세입자', landlord: '임대인' };
  var VISIT_TAG   = { tenant: 'tag-tenant', landlord: 'tag-landlord' };
  var TXN_LABEL = { sale: '매매', jeonse: '전세', monthly: '월세' };

  var notes = [
    { note_no: 21, visitor_name: '김도윤', visitor_phone: '010-2231-8845', visit_type: 'tenant', transaction_type: 'jeonse', status: 'proposed',
      property_name: '여의도 25시 공장', preferred_area: '영등포구 여의도동', agent_name: '나병연',
      visit_date: '2026-07-25 14:00', created_at: '2026-07-23 09:12',
      memos: [
        { name: '나병연', write_date: '2026-07-23 09:15', memo: '전세 예산 확인, 이번 주말 방문 예약 완료.' },
        { name: '나병연', write_date: '2026-07-23 11:40', memo: '여의도 매물 3건 우선 안내 예정.' }
      ]},
    { note_no: 20, visitor_name: '이서연', visitor_phone: '010-4471-2290', visit_type: 'landlord', transaction_type: 'sale', status: 'consulting',
      property_name: '-', preferred_area: '부천시 원미구', agent_name: '나병연',
      visit_date: '2026-07-24 10:30', created_at: '2026-07-22 16:03',
      memos: [ { name: '나병연', write_date: '2026-07-22 16:05', memo: '매도 희망가 문의, 등기부등본 지참 예정.' } ]},
    { note_no: 19, visitor_name: '박준서', visitor_phone: '010-9981-3312', visit_type: 'tenant', transaction_type: 'monthly', status: 'contracted',
      property_name: '상동 오피스텔 1204호', preferred_area: '상동', agent_name: '나병연',
      visit_date: '2026-07-18 15:00', created_at: '2026-07-15 10:20',
      memos: [
        { name: '나병연', write_date: '2026-07-15 10:22', memo: '월세 계약 조건 협의 시작.' },
        { name: '나병연', write_date: '2026-07-17 13:05', memo: '집주인과 조건 합의, 계약서 초안 발송.' },
        { name: '나병연', write_date: '2026-07-18 16:40', memo: '계약 완료. 잔금일 8/1 확정.' }
      ]},
    { note_no: 18, visitor_name: '최민아', visitor_phone: '010-5528-7701', visit_type: 'tenant', transaction_type: 'jeonse', status: 'lost',
      property_name: '-', preferred_area: '중동', agent_name: '나병연',
      visit_date: '2026-07-10 11:00', created_at: '2026-07-08 14:30',
      memos: [ { name: '나병연', write_date: '2026-07-08 14:32', memo: '타 지역으로 이사 계획 변경, 보류 요청.' } ]},
    { note_no: 17, visitor_name: '정하늘', visitor_phone: '010-1123-9087', visit_type: 'landlord', transaction_type: 'monthly', status: 'consulting',
      property_name: '중동 상가 1층', preferred_area: '중동', agent_name: '나병연',
      visit_date: '2026-07-26 13:00', created_at: '2026-07-23 08:50', memos: [] },
    { note_no: 16, visitor_name: '한지우', visitor_phone: '010-7743-2201', visit_type: 'tenant', transaction_type: 'sale', status: 'proposed',
      property_name: '역곡 아파트 802동', preferred_area: '역곡동', agent_name: '나병연',
      visit_date: '2026-07-27 16:00', created_at: '2026-07-21 11:15',
      memos: [ { name: '나병연', write_date: '2026-07-21 11:20', memo: '매매 예산 상향 가능, 3건 후보 안내 예정.' } ]}
  ];

  function renderRows() {
    var tbody = document.getElementById('noteTbody');
    tbody.innerHTML = notes.map(function (n) {
      return (
        '<tr>' +
          '<td>' + n.note_no + '</td>' +
          '<td><span class="tag ' + VISIT_TAG[n.visit_type] + '">' + VISIT_LABEL[n.visit_type] + '</span></td>' +
          '<td class="col-visitor"><a href="note_detail.html?note_no=' + n.note_no + '" style="color:inherit;text-decoration:none;">' + n.visitor_name + '</a><span class="phone">' + n.visitor_phone + '</span></td>' +
          '<td>' + TXN_LABEL[n.transaction_type] + '</td>' +
          '<td class="col-area">' + n.property_name + '</td>' +
          '<td class="col-area">' + n.preferred_area + '</td>' +
          '<td><span class="pill ' + STATUS_PILL[n.status] + '">' + STATUS_LABEL[n.status] + '</span></td>' +
          '<td><button type="button" class="memo-count" onclick="openMemoPopup(' + n.note_no + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8l-4 4z"/></svg>' + n.memos.length + '</button></td>' +
          '<td class="col-date">' + n.visit_date + '</td>' +
          '<td class="col-date">' + n.created_at + '</td>' +
          '<td><div class="row-actions">' +
            '<a class="btn btn-muted" href="note_register.html?note_no=' + n.note_no + '">글수정</a>' +
            '<button class="btn btn-muted" type="button" onclick="if(confirm(\'삭제하시겠습니까?\')) this.closest(\'tr\').remove();">글삭제</button>' +
          '</div></td>' +
        '</tr>'
      );
    }).join('');
  }

  function initials(name) { return name ? name.slice(-2) : '?'; }

  function renderMemoModal(n) {
    var memosHtml = n.memos.length
      ? n.memos.map(function (m) {
          return (
            '<div class="memo-item">' +
              '<div class="memo-avatar">' + initials(m.name) + '</div>' +
              '<div style="flex:1;">' +
                '<div class="memo-bubble">' +
                  '<div class="memo-byline"><span class="memo-writer">' + m.name + '</span><span class="memo-time">' + m.write_date + '</span></div>' +
                  m.memo +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }).join('')
      : '<p class="memo-empty">아직 등록된 메모가 없습니다.</p>';

    document.getElementById('memoModal').innerHTML =
      '<div class="memo-modal-head">' +
        '<div><h2>' + n.visitor_name + '</h2><div class="phone">' + n.visitor_phone + '</div></div>' +
        '<div class="head-actions">' +
          '<a class="detail-link" href="note_detail.html?note_no=' + n.note_no + '">상세보기 →</a>' +
          '<button class="memo-modal-close" type="button" onclick="closeMemoPopup()">✕</button>' +
        '</div>' +
      '</div>' +
      '<div class="memo-modal-body" id="memoModalBody">' + memosHtml + '</div>' +
      '<form class="memo-modal-form" id="memoModalForm">' +
        '<textarea placeholder="메모를 입력하세요" required></textarea>' +
        '<button class="btn btn-primary" type="submit">등록</button>' +
      '</form>';

    document.getElementById('memoModalForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var ta = e.target.querySelector('textarea');
      var text = ta.value.trim();
      if (!text) return;
      n.memos.push({ name: 'foray', write_date: new Date().toISOString().slice(0, 16).replace('T', ' '), memo: text });
      renderMemoModal(n);
      renderRows(); // 리스트의 메모 카운트도 갱신
      document.getElementById('memoModalBody').scrollTop = document.getElementById('memoModalBody').scrollHeight;
    });
  }

  function openMemoPopup(note_no) {
    var n = notes.find(function (x) { return x.note_no === note_no; });
    if (!n) return;
    renderMemoModal(n);
    document.getElementById('memoModalOverlay').classList.add('open');
  }
  function closeMemoPopup() {
    document.getElementById('memoModalOverlay').classList.remove('open');
  }
  document.getElementById('memoModalOverlay').addEventListener('click', function (e) {
    if (e.target === this) closeMemoPopup();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMemoPopup();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.status-tab'), function (tab) {
    tab.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.status-tab'), function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
    });
  });

  renderRows();
</script>
</body>
</html>
