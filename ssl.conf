# nginx.conf(80 포트, http 전용)의 짝 파일. *.bomul.ai.kr / bomul.ai.kr 와일드카드 인증서로
# 443 ssl을 서빙하는 서버블록만 모아둔다. 인증서가 .ai.kr만 커버하므로(.co.kr은 미발급),
# 여기 server_name도 .ai.kr만 사용한다.
#
# 인증서: /etc/letsencrypt/live/bomul.ai.kr/{fullchain,privkey}.pem
# (2026-08-03 certbot certonly --manual --preferred-challenges dns-01로 발급,
#  가비아 DNS TXT _acme-challenge.bomul.ai.kr 수동 검증)
#
# 배포: 이 파일을 /etc/nginx/sites-enabled/ 아래에 두면 nginx.conf(=sites-enabled/bomul)와
# 별개로 자동 include 된다(대부분 배포판의 /etc/nginx/nginx.conf가
# "include /etc/nginx/sites-enabled/*;"로 잡혀있음 - 서버에서 실제 메인 설정 확인 필요).

##
# WEB (React) - bo
##

server {
    listen 443 ssl;
    http2 on;
    server_name bo.bomul.ai.kr;

    ssl_certificate     /etc/letsencrypt/live/bomul.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bomul.ai.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/web_bomul_access.log;
    error_log /var/log/nginx/web_bomul_error.log warn;

    root /home/bomul/git/partner-bo/build/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
    }
}
##
# API domain (CodeIgniter4) - api.bomul.ai.kr
##

server {
    listen 443 ssl;
    http2 on;
    server_name api.bomul.ai.kr;

    ssl_certificate     /etc/letsencrypt/live/bomul.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bomul.ai.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /home/bomul/git/bomul-api/public;
    index index.php index.html;

    access_log /var/log/nginx/api_bomul_access.log;
    error_log  /var/log/nginx/api_bomul_error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        add_header Access-Control-Allow-Origin *;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
