# WEB (React)
##

server{
        listen 80;
        server_name bo.bomul.ai.kr;

        access_log /var/log/nginx/web_bomul_access.log;
        error_log /var/log/nginx/web_bomul_error.log warn;

        root /home/bomul/git/partner-bo/build/current;
        index index.html;

        location /{
                try_files $uri $uri/ /index.html;
        }
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
                expires 30d;
                access_log off;
        }
}

##
# API & sub domain (CodeIgniter4)
##

server {
    listen 80;
    server_name *.bomul.ai.kr;
    root /home/bomul/git/bomul-api/public;
    index index.php index.html;

    access_log /var/log/nginx/api_bomul_access.log;
    error_log  /var/log/nginx/api_bomul_error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(woff|woff2|ttf|eot|otf)$ {
           add_header Access-Control-Allow-Origin *;
        }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}

