<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2038"/>
      <stop offset="55%" stop-color="#123A5E"/>
      <stop offset="100%" stop-color="#1B4F72"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C9BFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4C9BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C0392B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C0392B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1500" cy="260" r="420" fill="url(#glow)"/>
  <rect x="1100" width="820" height="1080" fill="url(#accentGlow)"/>

  <!-- soft cloud bands -->
  <ellipse cx="380" cy="220" rx="520" ry="60" fill="#FFFFFF" opacity="0.03"/>
  <ellipse cx="1420" cy="150" rx="460" ry="50" fill="#FFFFFF" opacity="0.03"/>

