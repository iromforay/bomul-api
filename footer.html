<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>푸터 설정</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 40px;
        background: #fff;
        font-family: "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
        color: #222;
    }
    .panel {
        max-width: 760px;
    }
    .panel h3 {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 700;
    }
    .panel h3 .required {
        color: #e0332f;
    }
    .panel .desc {
        margin: 0 0 18px;
        font-size: 13px;
        color: #8a8a8a;
    }

    .field-group {
        margin-bottom: 14px;
    }
    .field-group.grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 12px;
    }
    .field-group.grid .field.full {
        grid-column: 1 / -1;
    }

    .field label {
        display: block;
        font-size: 12px;
        color: #6b6b6b;
        margin-bottom: 5px;
    }
    .field label .required {
        color: #e0332f;
        margin-left: 2px;
    }
    .field label .optional {
        color: #b3b3b3;
        font-weight: 400;
        margin-left: 4px;
    }

    input[type="text"], textarea {
        width: 100%;
        border: 1px solid #e3e3e3;
        background: #eef0f2;
        border-radius: 4px;
        padding: 12px 14px;
        font-size: 14px;
        color: #222;
        font-family: inherit;
        outline: none;
    }
    input[type="text"]:focus, textarea:focus {
        border-color: #006eff;
        background: #fff;
    }
    input[type="text"]::placeholder, textarea::placeholder {
        color: #aeb2b6;
    }

    .section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 26px 0 10px;
    }
    .section-title span.label {
        font-size: 13px;
        font-weight: 700;
        color: #333;
    }
    .section-title span.hint {
        font-size: 12px;
        color: #b3b3b3;
    }

    .divider {
        border: none;
        border-top: 1px solid #efefef;
        margin: 24px 0;
    }

    .preview-box {
        background: #f7f8f9;
        border: 1px dashed #d9dcdf;
        border-radius: 4px;
        padding: 14px 16px;
        font-size: 13px;
        line-height: 1.6;
        color: #555;
        min-height: 20px;
        word-break: break-all;
    }
    .preview-label {
        font-size: 12px;
        color: #8a8a8a;
        margin-bottom: 8px;
    }

    .btn-row {
        margin-top: 28px;
        text-align: right;
    }
    .btn-save {
        background: #006eff;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 11px 28px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-save:hover {
        background: #0058cc;
    }
</style>
</head>
<body>

<div class="panel">
    <h3>푸터 설정 <span class="required">*필수</span></h3>
    <p class="desc">사이트 내 최하단 영역에 들어가는 매장 세부사항들을 입력해주세요</p>

    <div class="field-group">
        <div class="field">
            <label for="company_name">상호명 <span class="required">*</span></label>
            <input type="text" id="company_name" name="company_name" placeholder="예) 25시 부동산" value="25시 부동산" required>
        </div>
    </div>

    <div class="section-title">
        <span class="label">중개사무소 법정 표시항목</span>
        <span class="hint">공인중개사법 제18조의2</span>
    </div>

    <div class="field-group grid">
        <div class="field full">
            <label for="broker_office_name">중개사무소 명칭 <span class="required">*</span></label>
            <input type="text" id="broker_office_name" name="broker_office_name" placeholder="예) 25시 공인중개사사무소" required>
        </div>

        <div class="field full">
            <label for="broker_address">중개사무소 소재지 <span class="required">*</span></label>
            <input type="text" id="broker_address" name="broker_address" placeholder="예) 경기 부천시 ○○로 12" required>
        </div>

        <div class="field">
            <label for="broker_phone">중개사무소 연락처 <span class="required">*</span></label>
            <input type="text" id="broker_phone" name="broker_phone" placeholder="예) 02-1234-5678" required>
        </div>

        <div class="field">
            <label for="broker_reg_no">중개사무소 등록번호 <span class="required">*</span></label>
            <input type="text" id="broker_reg_no" name="broker_reg_no" placeholder="예) 000-00-00000" required>
        </div>

        <div class="field">
            <label for="broker_ceo_name">개업공인중개사 성명 <span class="required">*</span></label>
            <input type="text" id="broker_ceo_name" name="broker_ceo_name" placeholder="예) 나병연" required>
        </div>

        <div class="field">
            <label for="broker_agent_name">소속공인중개사 성명 <span class="required">*</span></label>
            <input type="text" id="broker_agent_name" name="broker_agent_name" placeholder="예) 홍길동" required>
        </div>

        <div class="field full">
            <label for="broker_agent_phone">소속공인중개사 연락처 <span class="required">*</span></label>
            <input type="text" id="broker_agent_phone" name="broker_agent_phone" placeholder="예) 02-1234-5679" required>
        </div>
    </div>

    <hr class="divider">

    <div class="preview-label">미리보기 (사이트 하단 노출 형태)</div>
    <div class="preview-box" id="preview">대표이사 : 나병연 | 개인정보관리책임자 : 나병연 | 사업자등록번호 : 000-00-00000 | 주소 경기 부천시 | TEL 02-1234-5678</div>

    <div class="btn-row">
        <button type="button" class="btn-save" id="saveBtn">저장</button>
    </div>
</div>

<script>
    var fieldIds = [
        "broker_ceo_name","broker_agent_name","broker_reg_no",
        "broker_address","broker_phone","broker_office_name","broker_agent_phone"
    ];

    function updatePreview() {
        var ceo = document.getElementById("broker_ceo_name").value.trim();
        var agent = document.getElementById("broker_agent_name").value.trim();
        var regNo = document.getElementById("broker_reg_no").value.trim();
        var address = document.getElementById("broker_address").value.trim();
        var phone = document.getElementById("broker_phone").value.trim();
        var officeName = document.getElementById("broker_office_name").value.trim();

        var parts = [];
        if (officeName) parts.push(officeName);
        if (ceo) parts.push("대표이사 : " + ceo);
        if (agent) parts.push("소속공인중개사 : " + agent);
        if (regNo) parts.push("사업자등록번호 : " + regNo);
        if (address) parts.push("주소 " + address);
        if (phone) parts.push("TEL " + phone);

        document.getElementById("preview").textContent = parts.length ? parts.join(" | ") : "입력한 항목이 여기에 표시됩니다.";
    }

    fieldIds.forEach(function (id) {
        document.getElementById(id).addEventListener("input", updatePreview);
    });
</script>

</body>
</html>
